schema_variable_name: "twilio_schema"

include_databricks_sql: false
include_sqlserver: false
include_dbt_compile: true

test_scenarios:
  - name: "Default"
    vars: {}
    include_incremental: false

  - name: "modules disabled"
    vars:
      using_twilio_call: false
      using_twilio_messaging_service: false
      using_twilio_usage_record: false
    include_incremental: false